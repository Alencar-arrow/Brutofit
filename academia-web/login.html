<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/geral.css">
  <title>BrutoFit - Entrar</title>
</head>
<body>
  <div id="navbar-placeholder"></div>

  <div id="mensagem-flash"></div>

  <div class="divForm">
    <form id="formLogin">
      <p>Entrar</p>
      <p>Email:</p>
      <p><input type="email" name="email" id="email" required></p>
      <p>Senha:</p>
      <p><input type="password" name="senha" id="senha" required></p>
      <p><input type="submit" value="Enviar"></p>
      <p style="font-size: 0.85rem; color: var(--neutra-color-7); text-align:center;">
        Usuário de teste: admin@brutofit.com / 123456
      </p>
    </form>
  </div>

  <script src="js/db.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/app.js"></script>
  <script>
    seedDatabase().then(() => {
      renderNavbar();
      exibirMensagemFlash();
    });

    document.getElementById("formLogin").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const senha = document.getElementById("senha").value;

      const usuario = buscarUsuarioPorEmail(email);
      const senhaHash = await hashSenha(senha);

      if (usuario && usuario.senha === senhaHash) {
        setSessao({
          logado: true,
          nome: usuario.nome,
          email: usuario.email,
          foto: usuario.foto || "",
        });
        window.location.href = "listasUsuarios.html";
      } else {
        definirMensagem('<p class="erro">E-mail ou senha incorretos!</p>');
        window.location.reload();
      }
    });
  </script>
</body>
</html>
