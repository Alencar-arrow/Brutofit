<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/geral.css">
  <title>BrutoFit - Alterar Equipamento</title>
</head>
<body>
  <div id="navbar-placeholder"></div>

  <div id="mensagem-flash"></div>

  <div class="divForm" id="containerForm">
    <p>Carregando...</p>
  </div>

  <script src="js/db.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/app.js"></script>
  <script>
    seedDatabase().then(() => {
      renderNavbar();
      carregarFormulario();
    });

    function getParametro(nome) {
      return new URLSearchParams(window.location.search).get(nome);
    }

    function carregarFormulario() {
      const cod = getParametro("cod");
      const equipamento = buscarEquipamentoPorCodigo(cod);
      const container = document.getElementById("containerForm");

      if (!equipamento) {
        container.innerHTML = '<p class="erro">Equipamento não encontrado.</p>';
        return;
      }

      container.innerHTML = `
        <form id="formAlterar">
          <p>Nome:</p>
          <p><input type="text" name="nomeEquipamento" id="nomeEquipamento" value="${equipamento.nome}" required></p>
          <p>Descrição:</p>
          <p><textarea name="descricao" id="descricao" cols="30" rows="10" required>${equipamento.descricao}</textarea></p>
          <p>
            Músculo:
            <select name="musculo" id="musculo">
              <option value="Peito">Peito</option>
              <option value="Costas">Costas</option>
              <option value="Ombro">Ombro</option>
              <option value="Abdomen">Abdômen</option>
              <option value="Braco">Braço</option>
              <option value="Pernas">Pernas</option>
            </select>
          </p>
          <p class="imagem"><img src="${equipamento.foto || ""}" width="200" alt=""></p>
          <p>
            <label for="fileFoto">Foto</label>
            <input type="file" name="foto" id="fileFoto" accept="image/*">
          </p>
          <p><input type="submit" value="Enviar"></p>
        </form>
      `;

      document.getElementById("musculo").value = equipamento.musculo;

      document.getElementById("formAlterar").addEventListener("submit", async (e) => {
        e.preventDefault();
        const nomeEquipamento = document.getElementById("nomeEquipamento").value.trim();
        const descricao = document.getElementById("descricao").value.trim();
        const musculo = document.getElementById("musculo").value;
        const fotoInput = document.getElementById("fileFoto");

        const novaFoto = await arquivoParaBase64(fotoInput);
        const foto = novaFoto || equipamento.foto;

        atualizarEquipamento(cod, { nome: nomeEquipamento, musculo, descricao, foto });
        definirMensagem('<p class="sucesso">Registro atualizado com sucesso!</p>');
        window.location.href = "listarEquipamentos.html";
      });
    }
  </script>
</body>
</html>
