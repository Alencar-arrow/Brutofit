<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/geral.css">
  <title>BrutoFit - Usuários</title>
</head>
<body>
  <div id="navbar-placeholder"></div>

  <div id="mensagem-flash"></div>

  <p style="text-align:center; margin: 1.5rem 0;">
    <a href="addUsuarios.html" class="botao-inicio">+ Novo usuário</a>
  </p>

  <div class="cardsEquipamento" id="listaUsuarios"></div>

  <script src="js/db.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/app.js"></script>
  <script>
    seedDatabase().then(() => {
      if (!exigirLogin()) return;
      renderNavbar();
      exibirMensagemFlash();
      renderLista();
    });

    function renderLista() {
      const container = document.getElementById("listaUsuarios");
      const usuarios = listarUsuarios();

      if (usuarios.length === 0) {
        container.innerHTML = "<p>Nenhum usuário cadastrado ainda.</p>";
        return;
      }

      container.innerHTML = usuarios
        .map(
          (u) => `
        <div class="listagem">
          <p class="nome">${u.nome}</p>
          <div class="cardFotoContainer">
            ${u.foto ? `<img src="${u.foto}" alt="${u.nome}">` : ""}
          </div>
          <p class="descricaoEquipamento">${u.email}</p>
          <p class="musculo">Cargo: ${u.cargo}</p>
          <p class="botao">
            <a href="alterarUsuario.html?cod=${u.codigo}">Alterar</a>
            <a href="javascript:excluirUsuario(${u.codigo})">Excluir</a>
          </p>
        </div>
      `
        )
        .join("");
    }
  </script>
</body>
</html>
